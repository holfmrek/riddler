<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Riddler — gra z ukrytymi kodami.">
  <title>Riddler</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Ctext x='10' y='24' fill='white' font-family='Georgia,serif' font-size='27'%3Er%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme:dark; --bg:#0a0a0a; --text:#fafafa; --muted:#969696; --line:#454545; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    main { width:min(100%,464px); margin:auto; min-height:100svh; padding:32px 28px 20px; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; min-height:32px; }
    .brand { font-size:18px; font-weight:600; letter-spacing:-.8px; }
    .counter { color:var(--muted); font:13px/1.5 ui-monospace,monospace; letter-spacing:1px; }
    .screens { flex:1; display:grid; align-items:center; padding:56px 0; }
    section { grid-area:1/1; min-width:0; animation:appear .3s ease-out; }
    h1 { margin:0 0 24px; font-family:Georgia,"Times New Roman",serif; font-size:clamp(58px,16vw,80px); font-weight:400; line-height:1.02; letter-spacing:-2.5px; overflow-wrap:break-word; }
    h1 em { font-weight:400; }
    #welcome-title { font-family:inherit; }
    #welcome-title em { font-style:normal; }
    h1:focus { outline:none; }
    .stage-title { font-size:clamp(44px,12vw,60px); letter-spacing:-1.7px; line-height:1.12; }
    p { margin:0; }
    .copy { max-width:32ch; color:var(--muted); font-size:16px; line-height:1.8; white-space:pre-line; }
    button,input { font:inherit; }
    button { cursor:pointer; touch-action:manipulation; }
    .primary { display:block; width:100%; min-height:54px; padding:14px 20px; border:1px solid var(--text); border-radius:4px; background:var(--text); color:var(--bg); font-size:15px; font-weight:600; transition:background .16s ease,transform .16s ease; }
    .primary:hover { background:#dedede; }
    .primary:active { transform:translateY(1px); }
    #start { margin-top:40px; }
    form { margin-top:36px; }
    label { display:block; margin-bottom:8px; color:var(--muted); font-size:14px; }
    input { display:block; width:100%; min-width:0; min-height:58px; padding:8px 0 12px; border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent; color:var(--text); font:26px/1.4 ui-monospace,monospace; letter-spacing:10px; transition:border-color .16s ease; }
    input::placeholder { color:var(--muted); opacity:1; }
    input:focus { outline:none; border-bottom-color:var(--text); box-shadow:0 1px 0 var(--text); }
    input[aria-invalid="true"] { border-bottom:2px solid var(--text); }
    .error { min-height:24px; margin:8px 0 16px; color:var(--text); font-size:14px; }
    :focus-visible { outline:2px solid var(--text); outline-offset:5px; }
    footer { min-height:44px; }
    .secondary { min-height:44px; padding:10px 0; border:0; background:transparent; color:var(--muted); font-size:14px; text-decoration:underline; text-decoration-color:#454545; text-underline-offset:5px; }
    .secondary:hover { color:var(--text); }
    #save-note { padding:10px 0; color:var(--muted); font-size:14px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
    @keyframes appear { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    @media (max-height:640px) { .screens { padding:32px 0; } main { padding-top:24px; } }
    @media (max-width:360px) { main { padding-inline:24px; } }
    @media (prefers-reduced-motion:reduce) { section { animation:none; } button,input { transition:none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="brand">riddler.</span>
      <span class="counter" id="counter" aria-hidden="true"></span>
    </header>
    <div class="screens">
      <section id="welcome" aria-labelledby="welcome-title">
        <h1 id="welcome-title">Riddler</h1>
        <p class="copy">Znajdź wskazówki. Wpisz kody.</p>
        <button class="primary" id="start" type="button">Rozpocznij</button>
      </section>
      <section id="game" aria-labelledby="stage-title" hidden>
        <p class="sr-only" id="stage-label"></p>
        <h1 class="stage-title" id="stage-title" tabindex="-1" aria-describedby="stage-label"></h1>
        <p class="copy" id="riddle"></p>
        <form id="code-form" novalidate>
          <label for="code">Kod</label>
          <input id="code" name="code" type="text" inputmode="numeric" enterkeyhint="go" autocomplete="off" spellcheck="false" maxlength="12" placeholder="····" aria-describedby="code-help error">
          <p class="sr-only" id="code-help">Wpisz czterocyfrowy kod znaleziony w domu.</p>
          <p class="error" id="error" role="alert"></p>
          <button class="primary" type="submit">Dalej</button>
        </form>
      </section>
      <section id="finale" aria-labelledby="final-title" hidden>
        <h1 id="final-title" tabindex="-1" aria-label="Zagadka 4. Ostatni trop.">Ostatni<br><em>trop.</em></h1>
        <p class="copy" id="final-text"></p>
      </section>
    </div>
    <footer>
      <p id="save-note" role="status" hidden></p>
      <button class="secondary" type="button" id="reset" hidden>Od początku</button>
    </footer>
    <noscript>Włącz JavaScript, aby rozpocząć grę.</noscript>
  </main>
  <script>
    "use strict";
    // Tu zmieniamy treść etapów, kody oraz finał.
    // Gra bez serwera: kody są widoczne w źródle strony.
    const STAGES = [
      { title:"Zagadka 1.", text:"Mam drzwi, lecz nie wpuszczam gości.\nMam stopnie, lecz żadnych schodów.\nWojtek zostawił mi kiedyś karton.\nNie oddałem go w całości.", code:"0420" },
      { title:"Zagadka 2.", text:"Z różnych pokoi biegną do mnie kable.\nKażdy inną drogą, wszystkie w jedno miejsce.\nCzy wiesz, gdzie się spotykają?", code:"1337" },
      { title:"Zagadka 3.", text:"Tam, gdzie po naszych przerwach zostaje popiół, stoję na straży rusztu.\nMam pokrywę, pod którą warto zajrzeć.\nCzy wiesz, gdzie mnie znaleźć?", code:"6767" }
    ];
    const FINAL_TEXT = "W pomieszczeniu, gdzie zostawiasz buty, jestem półką, choć nie należę do szafy.\nPilnuję klucza, który dzieli Cię od końca dzisiejszej podróży.";
    const TOTAL_STAGES = STAGES.length + 1;
    const STORAGE_KEY = "riddler-zagadki-v1";
    const $ = id => document.getElementById(id);
    let stage = -1;

    function storageUnavailable() {
      $("save-note").hidden = false;
      $("save-note").textContent = "Zapis niedostępny. Zostaw tę kartę otwartą.";
    }
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Number.isInteger(saved) && saved >= -1 && saved <= STAGES.length) stage = saved;
    } catch { storageUnavailable(); }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stage)); }
      catch { storageUnavailable(); }
    }
    function render(moveFocus = false) {
      const playing = stage >= 0 && stage < STAGES.length;
      $("welcome").hidden = stage !== -1;
      $("game").hidden = !playing;
      $("finale").hidden = stage !== STAGES.length;
      $("reset").hidden = stage === -1;
      $("counter").textContent = stage >= 0 ? String(stage + 1).padStart(2, "0") + " / " + String(TOTAL_STAGES).padStart(2, "0") : "";
      $("code").value = "";
      $("error").textContent = "";
      $("code").removeAttribute("aria-invalid");
      if (playing) {
        $("stage-label").textContent = "Etap " + (stage + 1) + " z " + TOTAL_STAGES;
        $("stage-title").textContent = STAGES[stage].title;
        $("riddle").textContent = STAGES[stage].text;
      }
      $("final-text").textContent = FINAL_TEXT;
      if (moveFocus) {
        window.scrollTo({ top:0, behavior:"instant" });
        (stage === -1 ? $("start") : stage === STAGES.length ? $("final-title") : $("stage-title")).focus();
      }
    }
    $("start").addEventListener("click", () => { stage = 0; save(); render(true); });
    $("code").addEventListener("input", () => { $("error").textContent = ""; $("code").removeAttribute("aria-invalid"); });
    $("code-form").addEventListener("submit", event => {
      event.preventDefault();
      if (stage < 0 || stage >= STAGES.length) return;
      const entered = $("code").value.trim();
      if (entered !== STAGES[stage].code) {
        $("error").textContent = entered ? "Nieprawidłowy kod." : "Wpisz kod.";
        $("code").setAttribute("aria-invalid", "true");
        $("code").focus();
        return;
      }
      stage += 1;
      save();
      render(true);
    });
    $("reset").addEventListener("click", () => {
      if (window.confirm("Zacząć od początku?")) { stage = -1; save(); render(true); }
    });
    render();
  </script>
</body>
</html>
